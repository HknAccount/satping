apiVersion: apps/v1
kind: Deployment
metadata:
  name: satping
  labels:
    app: satping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satping
  template:
    metadata:
      labels:
        app: satping
    spec:
      containers:
      - name: satping
        image: 439638384547.dkr.ecr.eu-west-3.amazonaws.com/satping:latest
        env:
        - name: N2YO_API_KEY
          valueFrom:
            secretKeyRef:
              name: satping-secrets
              key: n2yo-api-key
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"